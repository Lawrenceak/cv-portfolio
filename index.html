<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; URL=portfolio_web/fe/html/main.html" />
  <title>Redirecting | Lawrence's Portfolio</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R1DMKCL736"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R1DMKCL736');
  </script>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f7f7f7; /* Light background */
        color: #1f2937; /* Dark text */
        overflow: hidden;
        position: relative;
    }

    /* Multi-color soft glows */
    body::before,
    body::after,
    .glow-red,
    .glow-green,
    .glow-yellow {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        opacity: 0.15;
        z-index: 0;
        animation: float 6s ease-in-out infinite alternate;
    }

    body::before {
        background: radial-gradient(circle, #3b82f6, transparent 70%); /* Blue */
        top: -150px;
        left: 50%;
        transform: translateX(-50%);
    }

    body::after {
        background: radial-gradient(circle, #f87171, transparent 70%); /* Red */
        bottom: -150px;
        right: 30%;
        animation-duration: 7s;
    }

    .glow-yellow {
        background: radial-gradient(circle, #facc15, transparent 70%); /* Yellow */
        top: 40%;
        left: 10%;
        animation-duration: 8s;
    }

    .glow-green {
        background: radial-gradient(circle, #34d399, transparent 70%); /* Green */
        bottom: 20%;
        left: 60%;
        animation-duration: 9s;
    }

    @keyframes float {
        from { transform: translateY(0px) translateX(0px); }
        to { transform: translateY(30px) translateX(20px); }
    }

    .container {
        position: relative;
        text-align: center;
        padding: 40px;
        max-width: 450px;
        z-index: 1; /* Ensure content is above glows */
    }

    h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .highlight {
        /* Blue gradient same as button shades */
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    p {
        font-size: 15px;
        opacity: 0.8;
        margin-bottom: 25px;
    }

    .btn {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 25px;
        border: 1px solid #3b82f6;
        color: #3b82f6;
        text-decoration: none;
        transition: 0.3s ease;
    }

    .btn:hover {
        background: #3b82f6;
        color: white;
        transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Glow layers -->
  <div class="glow-red"></div>
  <div class="glow-green"></div>
  <div class="glow-yellow"></div>

  <div class="container">
      <h1>Welcome to <span class="highlight">My Portfolio</span></h1>
      <p>You are being redirected. Please wait..</p>
      <p>If you are not redirected automatically</p>
      <br>
      <a class="btn" href="portfolio_web/fe/html/main.html">Click Here</a>
  </div>

</body>
</html>
